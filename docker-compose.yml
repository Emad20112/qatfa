services:
  # خادم قواعد البيانات PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: qatfa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-qatfa_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-qatfa_secure_pass_2026}
      POSTGRES_DB: ${DB_NAME:-qatfa_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-qatfa_user} -d ${DB_NAME:-qatfa_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qatfa-net

  # خادم الذاكرة المؤقتة والقوائم Redis 7
  redis:
    image: redis:7-alpine
    container_name: qatfa-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-qatfa_redis_pass_2026}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-qatfa_redis_pass_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qatfa-net

  # خادم الواجهات الخلفية NestJS (وضع التطوير)
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: qatfa-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-qatfa_user}
      DB_PASSWORD: ${DB_PASSWORD:-qatfa_secure_pass_2026}
      DB_NAME: ${DB_NAME:-qatfa_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-qatfa_redis_pass_2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - qatfa-net

networks:
  qatfa-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
